apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: 
    server: https://localhost:6500
  name: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
contexts:
- context:
    cluster: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
    user: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
  name: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
current-context: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
kind: Config
preferences: {}
users:
- name: arn:aws:eks:us-east-1:000000000000:cluster/lomax-cluster
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      args:
      - --region
      - us-east-1
      - eks
      - get-token
      - --cluster-name
      - lomax-cluster
      - --output
      - json
      command: aws
