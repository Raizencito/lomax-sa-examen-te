apiVersion: apps/v1
kind: Deployment
metadata: {name: lomax-backend, labels: {app: lomax-backend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: lomax-backend}}
  template:
    metadata: {labels: {app: lomax-backend}}
    spec:
      containers:
      - name: backend
        image: localhost:5100/lomax-backend:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8000}]
        env:
        - {name: DATABASE_URL, value: "postgresql://admin:admin123@172.17.0.2:7001/admin"}
        - {name: AWS_ENDPOINT_URL, value: "http://172.17.0.2:4566"}
        - {name: AWS_REGION, value: "us-east-1"}
        - {name: DYNAMODB_TABLE, value: "lomax-productos"}
        - {name: S3_BUCKET_ORIGINALES, value: "lomax-originales"}
        - {name: S3_BUCKET_MINIATURAS, value: "lomax-miniaturas"}
        - {name: LAMBDA_FUNCTION, value: "lomax-thumbnail"}
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: lomax-backend}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lomax-frontend, labels: {app: lomax-frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: lomax-frontend}}
  template:
    metadata: {labels: {app: lomax-frontend}}
    spec:
      containers:
      - name: frontend
        image: localhost:5100/lomax-frontend:1.0.0
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app: lomax-frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lomax-proxy, labels: {app: lomax-proxy}}
spec:
  replicas: 1
  selector: {matchLabels: {app: lomax-proxy}}
  template:
    metadata: {labels: {app: lomax-proxy}}
    spec:
      containers:
      - name: proxy
        image: localhost:5100/lomax-proxy:1.0.0
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: lomax-proxy}
spec:
  type: NodePort
  selector: {app: lomax-proxy}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
